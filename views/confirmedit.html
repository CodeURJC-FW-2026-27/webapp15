{{>header}}

<section class="page-section portfolio" id="portfolio">
  <div class="container">
    <!-- Edit Song Heading-->
    <h2
      class="page-section-heading text-center text-uppercase mb-0 detailGrids"
      style="margin-top: 1%">
      Confirm Edit
    </h2>
    <!-- Icon Divider-->
    <div class="divider-customd">
      <div class="divider-custom-lined"></div>
      <div class="divider-custom-icond"><i class="fas fa-star"></i></div>
      <div class="divider-custom-lined"></div>
    </div>
    <!-- Portfolio Grid Items-->
    <div class="row justify-content-center">

<table class="table table-dark" style="margin-bottom:10%; margin-top:5%">
    <tr><th></th><th style="color:white">Before</th><th style="color:white">After</th></tr>
    <tr><td style="color:white">Title</td><td style="color:white">{{old.title}}</td><td style="color:white">{{new.title}}</td></tr>
    <tr><td style="color:white">BPM</td><td style="color:white">{{old.bpm}}</td><td style="color:white">{{new.bpm}}</td></tr>
    <tr><td style="color:white">Runtime</td><td style="color:white">{{old.runtime}}</td><td style="color:white">{{new.runtime}}</td></tr>
    <tr><td style="color:white">Number</td><td style="color:white">{{old.number}}</td><td style="color:white">{{new.number}}</td></tr>
</table>

<form method="POST" action="/detail/{{albumId}}/songs/{{songId}}/edit">
    <input type="hidden" name="title" value="{{new.title}}">
    <input type="hidden" name="bpm" value="{{new.bpm}}">
    <input type="hidden" name="runtime" value="{{new.runtime}}">
    <input type="hidden" name="number" value="{{new.number}}">
    <button type="submit" class="btn btn-primary">Confirm and save</button>
</form>

<div class="button-detail ">
<button type="submit" class="btn btn-primary">
          <a href="/detail/{{albumId}}/songs/{{songId}}/edit" >Back to edit</a>
</button>
</div>

</div>

    </div>
  </div>
</section>

{{>footer}}
