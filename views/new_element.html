{{>header}}

    
        <!--  Main Center -->
        <main>


           <!-- Creation Container for Grid-->
            <div class="container"> 
                  <h2 class="page-section-heading text-center text-uppercase mb-0 mt-3 detailGrids">New Album </h2>
                  <!-- Icon Divider-->
                  <div class="divider-customd">
                      <div class="divider-custom-lined"></div>
                      <div class="divider-custom-icond"><i class="fas fa-star"></i></div>
                      <div class="divider-custom-lined"></div>
                  </div>
                <!--Form for creation page-->
                <div> 
                   <form class="row justify-content-center">

                        <div class="field col-lg-6 col-md-10 ">
                         <label for ="inputAuthor" >Album Name</label>
                         <input type="text" id="inputAuthor" class="form-control" placeholder="Album Name">
                       </div>

                        <div class="field col-lg-6 col-md-10 ">
                         <label for ="inputAuthor" >Author</label>
                         <input type="text" id="inputAuthor" class="form-control" placeholder="Author">
                        </div>

                       <div class="field col-lg-6 col-md-10 ">
                         <label for ="inputGenre" >Genre</label>
                         <input type="text" id="inputGenre" class="form-control" placeholder="Genre">
                       </div>

                       <div class="field col-lg-6 col-md-10 ">
                           <label for ="inputAlbumCover" > Album Cover</label>
                           <input type="file" id="inputAlbumCover" accept="image/*" class="form-control" placeholder="Album Cover">
                       </div>

                        <div class="field col-lg-6 col-md-10 ">
                          <label for ="inputLeadSingle" >Lead Single</label>
                          <input type="url" id="inputLeadSingle"class="form-control" placeholder="Lead Single (Youtube Video ID)">
                       </div>

                        <div class="field col-lg-6 col-md-10 ">
                         <label for ="inputDate" >Publication Date</label>
                         <input type="date" id="inputDate" class="form-control" placeholder="Date">
                       </div>

                       <div class="field col-lg-6 col-md-10 ">
                          <label for ="Description" > Description </label>
                          <textarea id="Description" rows="8" class="form-control" placeholder="Description"></textarea>
                       </div>

                       <div class="field col-lg-6 col-md-10">
                          <label for="Tracklist ">Tracklist</label>
                          <textarea id="songs" class="form-control" rows='16' placeholder="Tracklist"></textarea> 
                       </div>
                

                       <div class="formButtons col-12 d-flex justify-content-center gap-3 mb-5">
                         <button type="submit" class="btn btn-primary">
                            <a href="#">Save</a>
                         </button>
                         <button type="submit" class="btn btn-primary">
                            <a href="home">Cancel</a>
                         </button>
                       </div>

                    </form>
                </div>      
        
            </div>

        

        </main>



{{>footer}}
