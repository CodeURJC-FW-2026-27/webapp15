<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Record Scratch | Home</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/{{#home}}../{{/home}}css/styles.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>


    <body id="home-page" class="bg-primary">

        <!-- Masthead-->
        <header class="masthead bg-primary text-white text-center">
            <div> 

                <img class="masthead-avatar" src="/{{#home}}../{{/home}}resources/assets/record_left.png" alt="Vinyl Record" />

                <form class="searchForm" action="/home">
                    <input type="search" name="search" class="form-control" placeholder='Search by title (e.g "Halo")' aria-label="Search">
                    <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
                </form>

                <form action="/home" >
                        <div class="field genreFilter">
                            <select id="select" name="genre" class="form-control">
                            <option value="hyperpop">Hyperpop</option>
                            <option value="EDM">EDM</option>
                            <option value="k-pop">K-pop</option>
                            <option value="rock">Rock</option>
                            <option value="pop">Pop</option>
                            <option value="rap">Rap</option>
                            <option value="bachata">Bachata</option>
                            <option value="reggaeton">Reggaetón</option>
                            </select>
                        </div>
                    <button class="btn btn-primary" type="submit">Filter Genre</button>
                </form>
                
                <img class="masthead-avatar" src="/{{#home}}../{{/home}}resources/assets/record_right.png" alt="Vinyl Record" />
            </div>
        </header>

        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg bg-secondary text-uppercase" id="mainNav">
                <button class="navbar-toggler text-uppercase bg-primary text-white rounded" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav">
                        <li class="nav-item mx-0 mx-lg-1">
                            <a class="nav-link py-3 px-0 px-lg-3 rounded {{#home}}currentPage{{/home}}" href="/home/1">
                                Home
                            </a>
                        </li>
                        <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="#">Account</a></li>
                        <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="#">About Us</a></li>
                    </ul>
                </div>
        </nav>
