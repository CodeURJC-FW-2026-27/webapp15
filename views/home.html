{{>header}}

        <!-- Album Section Heading-->
                <h2 class="homeHeading page-section-heading text-center text-uppercase  mb-0 detailGrids">
                    The Vault
                </h2>
                <!-- Icon Divider-->
                <div class="homeDivider divider-customd">
                    <div class="divider-custom-lined"></div>
                    <div class="divider-custom-icond"><i class="fas fa-star"></i></div>
                    <div class="divider-custom-lined"></div>
                </div>

        <button class="btn btn-primary homeButton">
            <a class="text-white " href="../new_element">+ &nbsp; New Element</a>
        </button>

        <!-- AlbumGrid Section Begin -->
        <div class="albumGrid bg-secondary">
            <div class="container">
                <div class="row">

                    {{#shownAlbumsArray}}
                        <div class="slot col-lg-4 col-md-6 col-xs-12">
                            <a href="../detail">
                                 <img class="albumCover" src="/uploads/{{cover}}">
                                 <img class="record" src="../resources/assets/record.png">
                            </a>
                                 <p class="title">{{name}}</p>
                            <div class="authorGenre">
                                <p class="author text-muted">{{author}}</p>
                                <p class="genre {{genre}}">{{genre}}</p>
                            </div>
                        </div>
                    {{/shownAlbumsArray}}
                    
                </div>
            </div>
        </div> 

        <!-- AlbumGrid Section End -->
        

        <!-- Pagination Section Begin -->
        <nav aria-label="..." class="homePagination">
            <ul class="pagination">

                <li class="page-item">
                    <a class="page-link {{#first}} disabled {{/first}}" href="{{lastPage}}" >Previous</a>
                </li>

                {{#pagesArray}}
                        <li class="page-item {{#current}} active {{/current}}">
                            <a class="page-link" href="{{number}}">
                                {{number}}
                            </a>
                        </li>
                {{/pagesArray}}
                
                <li class="page-item">
                    <a class="page-link {{#last}} disabled {{/last}}" href="{{nextPage}}">Next</a>
                </li>

            </ul>
        </nav>
        <!-- Pagination Section End -->

{{>footer}}
